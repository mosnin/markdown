name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Type check / Lint / Test / Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        # Runs the full suite — all 1251 tests gate CI. Coverage is intentionally
        # NOT gated here: actual coverage is ~33% vs the aspirational 70% target,
        # and v8 instrumentation also destabilizes a few perf-sensitive tests
        # (worker timeouts). Use `pnpm test:coverage` locally; ratcheting coverage
        # up to threshold is tracked as a hardening task.
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Provide stub values so next build succeeds in CI without real Supabase
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
          NEXT_PUBLIC_APP_URL: https://placeholder.example.com
