[project]
name = "poggle-operator"
version = "0.1.0"
description = "Workspace Operator — the Poggle-native agent that produces reviewable diffs for knowledge work"
requires-python = ">=3.12"
dependencies = [
  "openai-agents>=0.0.10",
  "modal>=0.66.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "fastapi[standard]>=0.115.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.22.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by the formatter

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
